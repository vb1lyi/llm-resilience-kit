# The single place where dependency versions live. Latest stable as of 2026-11-02.

[versions]
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
mockserver = "9.2.0"
rest-assured = "6.3.0"
jackson = "2.22.4"
slf4j = "2.0.20"
logback = "1.6.6"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mockserver = { module = "org.testcontainers:testcontainers-mockserver" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

mockserver-client = { module = "org.mock-server:mockserver-client-java", version.ref = "mockserver" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }

jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

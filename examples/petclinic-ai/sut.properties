# The single place where the system under test (SUT) and its runtime images are pinned.
# Read by build.gradle.kts, passed to sut/build-image.sh (env) and to the tests (system properties).

# Spring PetClinic AI, pinned commit (2026-09-13, "Add Ollama AI support and modular Maven profiles...")
sut.repository=https://github.com/spring-petclinic/spring-petclinic-ai.git
sut.commit=d48e749c07ada12aa6161a6223bf292cb96e63f3
sut.image=llm-resilience/petclinic-ai:d48e749

# Cloud Native Buildpacks used by `spring-boot:build-image`, pinned by digest (the SUT's default is :latest).
# The builder resolves to run image tag 0.0.153; we pin that by digest too.
sut.builder=paketobuildpacks/builder-noble-java-tiny@sha256:974b67e0cd8cc9c43e0930cfebfd52b7002f206eb9898103f25ddb6155dcfca8
sut.run-image=paketobuildpacks/ubuntu-noble-run-tiny@sha256:b5aacecc8b049f54f683ff988db2ea0ae9a523873c12b15296ebbd39c6fb115a

# Database image: the version the SUT's own docker-compose.yml uses.
db.image=postgres:18.1
